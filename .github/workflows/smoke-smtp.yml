# Smoke SMTP real contra un deployment (go-live).
# NO es gate de PR. El runner no recibe SMTP_TOKEN ni PROTON_* (NFR-SEC-002/006).
# R-P0-03: bypass seguro vía header x-vercel-protection-bypass (secreto Actions).
# Criterio completo: HTTP 200 + correo en operaciones@ — ver docs/runbook-smoke-smtp.md

name: Smoke SMTP (go-live)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base del deployment READY (preview MITL o production), sin path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: POST /api/contact sintético
    runs-on: ubuntu-latest
    steps:
      - name: Enviar smoke sintético
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          base="${TARGET_URL%/}"
          if [[ ! "$base" =~ ^https:// ]]; then
            echo "::error::target_url debe ser https://"
            exit 1
          fi

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::error::Falta el secreto Actions VERCEL_AUTOMATION_BYPASS_SECRET (R-P0-03)."
            echo "::error::Generar Protection Bypass for Automation en Vercel → copiar a GitHub Actions secrets."
            echo "::error::Ver docs/runbook-smoke-smtp.md"
            exit 1
          fi

          # Payload sintético (sin PII reales). Asunto de la lista cerrada CONTACT_SUBJECTS.
          payload='{
            "name": "Smoke CI Alexendros",
            "email": "smoke-ci@example.com",
            "subject": "Asesoramiento tecnológico · Consultor especializado",
            "message": "Mensaje sintético de smoke SMTP go-live. No es un lead real.",
            "consent": true,
            "website": ""
          }'

          echo "POST ${base}/api/contact"
          # Bypass en header (no query string). No imprimir el secreto ni cabeceras de auth.
          http_code="$(curl -sS -o /tmp/smoke-body.json -w '%{http_code}' \
            -X POST "${base}/api/contact" \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --data "$payload")"

          echo "HTTP ${http_code}"
          # Cuerpo de API: ok/code/message — sin tokens.
          cat /tmp/smoke-body.json
          echo

          {
            echo "## Smoke SMTP"
            echo ""
            echo "- URL: \`${base}/api/contact\`"
            echo "- HTTP: \`${http_code}\`"
            echo "- Bypass: header \`x-vercel-protection-bypass\` (secreto presente; valor no logueado)"
            echo "- Body:"
            echo '```json'
            cat /tmp/smoke-body.json
            echo
            echo '```'
            echo ""
            echo "Criterio humano: correo recibido en \`operaciones@alexendros.dev\` (runbook)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$http_code" == "401" ]] || [[ "$http_code" == "403" ]]; then
            echo "::error::${http_code} — protección Vercel; revisar bypass secret o Deployment Protection"
            exit 1
          fi
          if [[ "$http_code" == "503" ]]; then
            echo "::error::503 unavailable — sync-env + redeploy pendientes o vars SMTP ausentes"
            exit 1
          fi
          if [[ "$http_code" == "502" ]]; then
            echo "::error::502 provider — revisar configuración SMTP en el deployment (sin loguear secretos)"
            exit 1
          fi
          if [[ "$http_code" == "429" ]]; then
            echo "::error::429 rate limit — reintentar más tarde"
            exit 1
          fi
          if [[ "$http_code" != "200" ]]; then
            echo "::error::HTTP ${http_code} inesperado"
            exit 1
          fi

          if ! grep -q '"ok":\s*true' /tmp/smoke-body.json && ! grep -q '"ok":true' /tmp/smoke-body.json; then
            echo "::error::Respuesta 200 sin ok:true"
            exit 1
          fi

          echo "API OK. Confirmar correo en operaciones@ (docs/runbook-smoke-smtp.md)."
