# Tag y GitHub Release desde CI. NO despliega ni hace PROMOTE (ADR-0025 / ADR-0026).
# Solo workflow_dispatch. Versionado ≠ promoción.

name: Release (tag)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver sin prefijo v (ej. 1.0.0). Se crea el tag vX.Y.Z"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Crear tag y Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar semver y que el tag no exista
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version debe ser semver X.Y.Z (sin prefijo v)"
            exit 1
          fi
          tag="v${VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::El tag ${tag} ya existe"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "Creará ${tag} en ${GITHUB_SHA} (sin deploy)."

      - name: Crear tag anotado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}

          ADR-0026: versionado ≠ promoción. Este tag no despliega ni hace PROMOTE."
          git push origin "$TAG"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(cat <<EOF
          ## ${TAG}

          Tag creado por el workflow **Release (tag)** (ADR-0026).

          - **No** despliega a Vercel.
          - **No** ejecuta \`PROMOTE\` (ADR-0025).
          - Producción: workflow **Deploy fase (Vercel)** con \`confirmation=PROMOTE\` tras firma MITL.
          - Rollback: redeploy del tag anterior (checklist P8-1).

          Commit: ${GITHUB_SHA}
          EOF
          )"

      - name: Recordatorio anti-PROMOTE
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "- Tag y GitHub Release creados."
            echo "- **No** se ha invocado deploy-phase ni PROMOTE."
            echo "- Siguiente paso humano (si aplica): Deploy fase + confirmación explícita."
          } >> "$GITHUB_STEP_SUMMARY"
