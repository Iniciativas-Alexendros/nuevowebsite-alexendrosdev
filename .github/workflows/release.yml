# Tag y GitHub Release desde CI. NO despliega ni hace PROMOTE (ADR-0025 / ADR-0026).
# Solo workflow_dispatch. Versionado ≠ promoción.
# R-P0-01: expected_sha obligatorio — el tag DEBE apuntar exactamente a ese SHA en main.

name: Release (tag)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver sin prefijo v (ej. 1.0.0). Se crea el tag vX.Y.Z"
        required: true
        type: string
      expected_sha:
        description: "SHA completo (40 hex) aprobado — DEBE existir en main y coincidir con preview/PROMOTE"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Crear tag y Release
    runs-on: ubuntu-latest
    steps:
      - name: Validar expected_sha
        id: sha
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha DEBE ser SHA completo de 40 hex (R-P0-01)."
            exit 1
          fi
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      # Trunk-based (ADR-0026): pin al SHA aprobado, no al tip móvil de main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.sha.outputs.expected_sha }}
          fetch-depth: 0

      - name: Validar semver, SHA en main y que el tag no exista
        env:
          VERSION: ${{ github.event.inputs.version }}
          EXPECTED_SHA: ${{ steps.sha.outputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version debe ser semver X.Y.Z (sin prefijo v)"
            exit 1
          fi
          tag="v${VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::El tag ${tag} ya existe"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD ($head_sha) ≠ expected_sha ($EXPECTED_SHA)."
            exit 1
          fi
          # Fetch completo de main: --depth=1 truncaría el historial y rompería
          # merge-base --is-ancestor cuando expected_sha no es el tip (R-P0-01).
          git fetch origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::expected_sha $EXPECTED_SHA no está en origin/main (trunk-based)."
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"
          echo "Creará ${tag} en ${EXPECTED_SHA} (R-P0-01; sin deploy)."

      - name: Crear tag anotado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "Release ${TAG}

          ADR-0026: versionado ≠ promoción. Este tag no despliega ni hace PROMOTE.
          R-P0-01: expected_sha=${RELEASE_SHA}."
          git push origin "$TAG"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$RELEASE_SHA" \
            --notes "$(cat <<EOF
          ## ${TAG}

          Tag creado por el workflow **Release (tag)** (ADR-0026 / R-P0-01).

          - SHA inmutable: \`${RELEASE_SHA}\` (mismo que preview MITL y PROMOTE).
          - **No** despliega a Vercel.
          - **No** ejecuta \`PROMOTE\` (ADR-0025).
          - Producción: workflow **Deploy fase (Vercel)** con \`expected_sha\` + \`confirmation=PROMOTE\` tras firma MITL.
          - Rollback: ver [docs/runbook-rollback.md](../docs/runbook-rollback.md).
          - \`package.json\` version puede permanecer en \`0.1.0\` (ADR-0026: independencia npm ↔ tag).
          EOF
          )"

      - name: Recordatorio anti-PROMOTE
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "- Tag y GitHub Release en \`${RELEASE_SHA}\` (\`expected_sha\`)."
            echo "- **No** se ha invocado deploy-phase ni PROMOTE."
            echo "- Siguiente paso humano (si aplica): Deploy fase + confirmación explícita."
          } >> "$GITHUB_STEP_SUMMARY"
