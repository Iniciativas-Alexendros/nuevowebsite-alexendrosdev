# Sincroniza secretos de org/repo → variables de entorno de Vercel (ADR-0021).
# No imprime valores. Solo workflow_dispatch (manual).
#
# Requiere org secrets (visibility=all si el repo es público):
# PROTON_SMTP_HOST, PROTON_SMTP_PORT, PROTON_MAIL_FROM, PROTON_SMTP_USER,
# PROTON_SMTP_TOKEN (submission, no Bridge).
# Repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

name: Sync env → Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sincronizar secretos a Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos requeridos
        env:
          PROTON_SMTP_HOST: ${{ secrets.PROTON_SMTP_HOST }}
          PROTON_SMTP_PORT: ${{ secrets.PROTON_SMTP_PORT }}
          PROTON_MAIL_FROM: ${{ secrets.PROTON_MAIL_FROM }}
          PROTON_SMTP_USER: ${{ secrets.PROTON_SMTP_USER }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in PROTON_SMTP_HOST PROTON_SMTP_PORT PROTON_MAIL_FROM PROTON_SMTP_USER PROTON_SMTP_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Falta secreto: $name" >&2
              missing=1
            else
              echo "OK: $name presente (valor no mostrado)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Crea los secretos faltantes (token SMTP submission de Proton; no uses PROTON_BRIDGE_PASS)." >&2
            echo "Org secrets en repos públicos: visibility=all." >&2
            exit 1
          fi

      - name: Comprobar acceso API Vercel (sin filtrar secretos)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          user_code=$(curl -sS -o /tmp/vercel-user.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)
          echo "GET /v2/user → HTTP $user_code"
          if [ "$user_code" != "200" ]; then
            echo "VERCEL_TOKEN inválido o sin permiso. Regenera el token en Vercel → Account → Tokens y actualiza el repo secret." >&2
            exit 1
          fi
          proj_code=$(curl -sS -o /tmp/vercel-proj.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          echo "GET /v9/projects/{id}?teamId=… → HTTP $proj_code"
          if [ "$proj_code" != "200" ]; then
            echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID incorrectos o el token no tiene acceso al team/proyecto." >&2
            exit 1
          fi

      - name: Upsert variables en Preview y Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROTON_SMTP_HOST: ${{ secrets.PROTON_SMTP_HOST }}
          PROTON_SMTP_PORT: ${{ secrets.PROTON_SMTP_PORT }}
          PROTON_MAIL_FROM: ${{ secrets.PROTON_MAIL_FROM }}
          PROTON_SMTP_USER: ${{ secrets.PROTON_SMTP_USER }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
        run: |
          set -euo pipefail

          # Enlace por env (patrón CI oficial); evita .vercel/project.json frágil
          export VERCEL_ORG_ID VERCEL_PROJECT_ID

          upsert() {
            local name="$1"
            local value="$2"
            local sensitive_flag="$3"
            local env_target
            for env_target in production preview; do
              echo "Upsert $name → $env_target"
              if [ "$sensitive_flag" = "sensitive" ]; then
                printf '%s' "$value" | npx vercel@latest env add "$name" "$env_target" \
                  --token "$VERCEL_TOKEN" --yes --force --sensitive \
                  --scope "$VERCEL_ORG_ID"
              else
                printf '%s' "$value" | npx vercel@latest env add "$name" "$env_target" \
                  --token "$VERCEL_TOKEN" --yes --force \
                  --scope "$VERCEL_ORG_ID"
              fi
            done
          }

          # Runtime (ARCHITECTURE §9.2)
          upsert SMTP_HOST "$PROTON_SMTP_HOST" sensitive
          upsert SMTP_PORT "$PROTON_SMTP_PORT" sensitive
          upsert CONTACT_TO_EMAIL "$PROTON_MAIL_FROM" sensitive
          upsert EMAIL_FROM_ADDRESS "$PROTON_MAIL_FROM" sensitive
          upsert SMTP_USER "$PROTON_SMTP_USER" sensitive
          upsert SMTP_TOKEN "$PROTON_SMTP_TOKEN" sensitive

          upsert NEXT_PUBLIC_SITE_URL "https://alexendros.dev" plain
          upsert NEXT_PUBLIC_SITE_NAME "Alexendros" plain

          echo "Sync completado. Redeploy necesario para que el runtime las cargue."
