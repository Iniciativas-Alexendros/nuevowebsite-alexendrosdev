# Sincroniza secretos de org/repo → variables de entorno de Vercel (ADR-0021).
# No imprime valores. Solo workflow_dispatch (manual).
#
# Requiere org secrets (visibility=all si el repo es público):
# PROTON_SMTP_HOST, PROTON_SMTP_PORT, PROTON_MAIL_FROM, PROTON_SMTP_TOKEN
# (submission, no Bridge). PROTON_MAIL_FROM = To + From + SMTP_USER (misma
# dirección del token Proton, p. ej. operaciones@). Mailto público hola@ es catch-all.
# Repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#
# CLI fijada (no @latest) en rutas con secretos — supply-chain.

name: Sync env → Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@59.1.3

jobs:
  sync:
    name: Sincronizar secretos a Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar secretos requeridos
        env:
          PROTON_SMTP_HOST: ${{ secrets.PROTON_SMTP_HOST }}
          PROTON_SMTP_PORT: ${{ secrets.PROTON_SMTP_PORT }}
          PROTON_MAIL_FROM: ${{ secrets.PROTON_MAIL_FROM }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in PROTON_SMTP_HOST PROTON_SMTP_PORT PROTON_MAIL_FROM PROTON_SMTP_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Falta secreto: $name" >&2
              missing=1
            else
              echo "OK: $name presente (valor no mostrado)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Crea los secretos faltantes (token SMTP submission de Proton; no uses PROTON_BRIDGE_PASS)." >&2
            echo "Org secrets en repos públicos: visibility=all." >&2
            exit 1
          fi

      - name: Comprobar acceso API Vercel (sin filtrar secretos)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Newlines/espacios al pegar el secret rompen Bearer auth ("User not found").
          VERCEL_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "token_len=${#VERCEL_TOKEN}"
          if [ "${#VERCEL_TOKEN}" -lt 20 ]; then
            echo "VERCEL_TOKEN demasiado corto tras sanitizar; re-súbelo sin comillas ni saltos." >&2
            exit 1
          fi

          user_code=$(curl -sS -o /tmp/vercel-user.json -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v2/user")
          echo "GET /v2/user → HTTP $user_code"
          if [ "$user_code" != "200" ]; then
            echo "VERCEL_TOKEN rechazado por la API (no CLI)." >&2
            echo "Crea un token personal en https://vercel.com/account/tokens" >&2
            echo "logueado como operaciones@alexendros.dev (scope del team) y:" >&2
            echo "  printf '%s' 'TOKEN' | gh secret set VERCEL_TOKEN -R Iniciativas-Alexendros/nuevowebsite-alexendrosdev" >&2
            # Cuerpo de error sin token; suele ser JSON pequeño.
            head -c 200 /tmp/vercel-user.json >&2 || true
            echo >&2
            exit 1
          fi
          echo "API /v2/user OK (identidad no mostrada)"

          if ! npx "$VERCEL_CLI" whoami --token "$VERCEL_TOKEN" >/tmp/vercel-whoami.txt 2>/tmp/vercel-whoami.err; then
            echo "API OK pero CLI whoami falló; se continúa con la API como fuente de verdad." >&2
            tail -n 5 /tmp/vercel-whoami.err >&2 || true
          else
            echo "vercel whoami OK (identidad no mostrada)"
          fi

          proj_code=$(curl -sS -o /tmp/vercel-proj.json -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          echo "GET /v9/projects/{id}?teamId=… → HTTP $proj_code"
          if [ "$proj_code" != "200" ]; then
            echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID incorrectos o el token no tiene acceso al team/proyecto." >&2
            head -c 200 /tmp/vercel-proj.json >&2 || true
            echo >&2
            exit 1
          fi
          echo "Acceso al proyecto OK"

      - name: Upsert variables en Preview y Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROTON_SMTP_HOST: ${{ secrets.PROTON_SMTP_HOST }}
          PROTON_SMTP_PORT: ${{ secrets.PROTON_SMTP_PORT }}
          PROTON_MAIL_FROM: ${{ secrets.PROTON_MAIL_FROM }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
        run: |
          set -euo pipefail

          # Misma sanitización que el precheck (newlines al pegar el secret).
          VERCEL_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          # Enlace por env (patrón CI oficial); evita .vercel/project.json frágil
          export VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN

          upsert() {
            local name="$1"
            local value="$2"
            local sensitive_flag="$3"
            local env_target
            for env_target in production preview; do
              echo "Upsert $name → $env_target"
              if [ "$sensitive_flag" = "sensitive" ]; then
                printf '%s' "$value" | npx "$VERCEL_CLI" env add "$name" "$env_target" \
                  --token "$VERCEL_TOKEN" --yes --force --sensitive \
                  --scope "$VERCEL_ORG_ID"
              else
                printf '%s' "$value" | npx "$VERCEL_CLI" env add "$name" "$env_target" \
                  --token "$VERCEL_TOKEN" --yes --force \
                  --scope "$VERCEL_ORG_ID"
              fi
            done
          }

          # Runtime (ARCHITECTURE §9.2). Proton: misma dirección = To + From + SMTP_USER.
          upsert SMTP_HOST "$PROTON_SMTP_HOST" sensitive
          upsert SMTP_PORT "$PROTON_SMTP_PORT" sensitive
          upsert CONTACT_TO_EMAIL "$PROTON_MAIL_FROM" sensitive
          upsert EMAIL_FROM_ADDRESS "$PROTON_MAIL_FROM" sensitive
          upsert SMTP_USER "$PROTON_MAIL_FROM" sensitive
          upsert SMTP_TOKEN "$PROTON_SMTP_TOKEN" sensitive

          upsert NEXT_PUBLIC_SITE_URL "https://alexendros.dev" plain
          upsert NEXT_PUBLIC_SITE_NAME "Alexendros" plain

          echo "Sync completado. Redeploy necesario para que el runtime las cargue."
