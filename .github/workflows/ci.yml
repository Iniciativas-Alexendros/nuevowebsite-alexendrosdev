name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test (Vitest + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: E2E + axe-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  security:
    name: Secretos + auditoría
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escanear secretos
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --exit-code 1 --redact
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  lighthouse:
    name: Lighthouse CI (preview de Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar preview en Vercel
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          url=""
          # 1) Reutilizar el deploy que ya crea la integración de git de Vercel
          #    para este commit (no consume cuota de deploys del plan Hobby).
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$GITHUB_SHA" ]; then
            url=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=10" \
              | python3 -c "
          import json, sys, os
          sha = os.environ.get('GITHUB_SHA', '')
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          for d in data.get('deployments', []):
              if d.get('meta', {}).get('githubCommitSha') == sha and d.get('state') == 'READY':
                  print('https://' + d['url'])
                  break
          " 2>/dev/null || true)
          fi
          # 2) Respaldo: crear un deploy manual (solo si no hay deploy existente).
          if [ -z "$url" ]; then
            mkdir -p .vercel
            printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
            set +e
            npx vercel@latest deploy --token "$VERCEL_TOKEN" --yes > /tmp/vercel-deploy.log 2>&1
            deploy_status=$?
            set -e
            cat /tmp/vercel-deploy.log
            if [ "$deploy_status" -ne 0 ]; then
              echo "vercel deploy falló con código $deploy_status (ver log arriba)" >&2
              exit "$deploy_status"
            fi
            url=$(grep -oE 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)
          else
            echo "Reutilizando deploy existente de la integración de git: $url"
          fi
          if [ -z "$url" ]; then echo "No se pudo obtener la URL del preview" >&2; exit 1; fi
          echo "preview-url=$url" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Calentar el preview antes de medir
        run: |
          url="${{ steps.vercel-deploy.outputs.preview-url }}"
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
            echo "Warm-up $i: HTTP $code"
            sleep 2
          done
      - run: pnpm exec lhci autorun --config=./lighthouserc.json --collect.url="${{ steps.vercel-deploy.outputs.preview-url }}"
