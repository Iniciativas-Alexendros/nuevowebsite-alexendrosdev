name: Deploy fase (Vercel)

# ADR-0025 — Preview MITL tras integrar la fase en main (antes de firmar cierre).
# Firma DEC-ROADMAP-03 solo tras validar preview. Production: PROMOTE + entorno `Production`.
# CLI fijada (no @latest) en rutas con secretos — supply-chain (mismo criterio que sync-env).

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Número de fase ROADMAP (ej. 6). Preview = antes de firmar; production = tras firmar"
        required: true
        type: string
      target:
        description: "Destino del despliegue"
        required: true
        type: choice
        options:
          - preview
          - production
      confirmation:
        description: "Solo production: PROMOTE tras QA del preview y firma de cierre de fase"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-fase-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@59.1.3

jobs:
  deploy-preview:
    name: Preview de fase ${{ github.event.inputs.phase }}
    if: github.event.inputs.target == 'preview'
    runs-on: ubuntu-latest
    environment: phase-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Desplegar preview desde main
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          VERCEL_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx "$VERCEL_CLI" pull --yes --environment=preview --token "$VERCEL_TOKEN"
          npx "$VERCEL_CLI" build --token "$VERCEL_TOKEN"
          set +e
          npx "$VERCEL_CLI" deploy --prebuilt --token "$VERCEL_TOKEN" | tee /tmp/vercel-out.txt
          deploy_ec=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_ec" -ne 0 ]; then
            echo "vercel deploy falló (exit $deploy_ec). Últimas líneas:" >&2
            tail -n 40 /tmp/vercel-out.txt >&2 || true
            exit "$deploy_ec"
          fi
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app[^[:space:]]*' /tmp/vercel-out.txt | tail -n 1 || true)
          if [ -z "$url" ]; then
            url=$(tail -n 1 /tmp/vercel-out.txt)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview Fase ${{ github.event.inputs.phase }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Siguiente:** QA visual MITL → si OK, firmar cierre de fase (DEC-ROADMAP-03) → relanzar con target \`production\` y confirmation \`PROMOTE\`." >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Producción tras MITL (fase ${{ github.event.inputs.phase }})
    if: github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Exigir confirmación PROMOTE
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "PROMOTE" ]; then
            echo "Abortado: para production el input confirmation DEBE ser exactamente PROMOTE (ADR-0025)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Desplegar producción desde main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          VERCEL_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
          set +e
          npx "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tee /tmp/vercel-out.txt
          deploy_ec=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_ec" -ne 0 ]; then
            echo "vercel deploy falló (exit $deploy_ec). Últimas líneas:" >&2
            tail -n 40 /tmp/vercel-out.txt >&2 || true
            exit "$deploy_ec"
          fi
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app[^[:space:]]*' /tmp/vercel-out.txt | tail -n 1 || true)
          if [ -z "$url" ]; then
            url=$(tail -n 1 /tmp/vercel-out.txt)
          fi
          echo "### Producción Fase ${{ github.event.inputs.phase }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Confirmación MITL + firma de fase: PROMOTE" >> "$GITHUB_STEP_SUMMARY"
