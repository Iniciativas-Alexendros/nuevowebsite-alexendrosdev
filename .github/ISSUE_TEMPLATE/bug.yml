name: Reporte de error
description: Informa de un defecto.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: resumen
    attributes:
      label: Resumen
      description: Qué falla y dónde.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
  - type: textarea
    id: real
    attributes:
      label: Comportamiento observado
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Navegador, versión, capturas, traza.
